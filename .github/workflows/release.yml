# Publishing a release:
#   git tag v1.2.3 && git push origin v1.2.3
# Optional, in the tag message or as workflow inputs:
#   min_version  – instances below this version update immediately
#   critical     – every instance installs this release right away
name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.2.3"
        required: true
      min_version:
        description: "Minimum version allowed to keep running (forces update below it)"
        required: false
      critical:
        description: "Critical release: install immediately everywhere"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Test
        run: go test -count=1 ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X github.com/flocom/invoicer/internal/config.Version=${TAG}" \
              -o dist/invoicer-linux-$arch ./cmd/invoicer
          done

      - name: Sign update manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          NOTES="$(git tag -l --format='%(contents:subject)' "$TAG")"
          ARGS=(-version "$TAG" -dir dist -notes "$NOTES")
          if [ -n "${{ inputs.min_version }}" ]; then ARGS+=(-min "${{ inputs.min_version }}"); fi
          if [ "${{ inputs.critical }}" = "true" ]; then ARGS+=(-critical); fi
          go run ./cmd/release manifest "${ARGS[@]}"
          (cd dist && sha256sum invoicer-linux-* > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.TAG }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ env.TAG }}
            ${{ steps.img.outputs.name }}:latest
          provenance: true
          sbom: true
