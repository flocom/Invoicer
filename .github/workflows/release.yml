# Every push to main publishes a new version automatically:
#   - computes the next tag from the last one (first release: v0.1.0)
#       patch by default, minor if a commit starts with "feat",
#       major if a commit contains "BREAKING CHANGE" or "#major"
#   - builds the Linux binaries, signs the update manifest, creates the
#     GitHub release and pushes the Docker image (vX.Y.Z + latest)
# Commit message keyword: [skip release] does not publish for this push.
# Forcing an immediate install everywhere ("critical", "min_version") is only
# possible from a manual run (Actions → Release → Run workflow), never from
# commit text, which outside contributors can write.
# Signing uses the RELEASE_SIGNING_KEY secret of the "release" environment,
# restricted to the main branch (add required reviewers there to approve
# every release by hand).
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      min_version:
        description: "Minimum version allowed to keep running (forces update below it)"
        required: false
      critical:
        description: "Critical release: install immediately everywhere"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write   # keyless image signing (cosign)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Compute version
        id: v
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          IN_MIN: ${{ inputs.min_version }}
          IN_CRIT: ${{ inputs.critical }}
          EVENT: ${{ github.event_name }}
        run: |
          git fetch --tags --force
          LAST=$(git tag -l 'v*.*.*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -n "$LAST" ]; then
            if [ -z "$(git log "$LAST..HEAD" --format=%H)" ]; then
              echo "No new commits since $LAST"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            MSGS=$(git log "$LAST..HEAD" --format=%B)
          else
            MSGS=$(git log --format=%B)
          fi
          if [ "$EVENT" = "push" ] && echo "$(git log -1 --format=%B)" | grep -qi '\[skip release\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$LAST" ]; then
            NEXT=v0.1.0
          else
            IFS=. read -r MA MI PA <<< "${LAST#v}"
            if [ "$BUMP" = auto ]; then
              if echo "$MSGS" | grep -qE 'BREAKING CHANGE|#major'; then BUMP=major
              elif echo "$MSGS" | grep -qE '^feat(\(.+\))?!?:'; then BUMP=minor
              else BUMP=patch; fi
            fi
            case "$BUMP" in
              major) NEXT="v$((MA+1)).0.0" ;;
              minor) NEXT="v$MA.$((MI+1)).0" ;;
              *)     NEXT="v$MA.$MI.$((PA+1))" ;;
            esac
          fi
          MIN=""
          if [ -n "$IN_MIN" ]; then
            echo "$IN_MIN" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "invalid min_version"; exit 1; }
            MIN="$IN_MIN"
          fi
          CRIT=false
          if [ "$IN_CRIT" = "true" ]; then CRIT=true; fi
          NOTES=$(git log -1 --format=%s)
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "min=$MIN" >> "$GITHUB_OUTPUT"
          echo "critical=$CRIT" >> "$GITHUB_OUTPUT"
          { echo "notes<<EOF_NOTES"; echo "$NOTES"; echo "EOF_NOTES"; } >> "$GITHUB_OUTPUT"
          echo "Releasing $NEXT (previous: ${LAST:-none})"

      - name: Test
        if: steps.v.outputs.skip != 'true'
        run: go test -count=1 ./...

      - name: Build binaries
        if: steps.v.outputs.skip != 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X github.com/flocom/invoicer/internal/config.Version=${TAG}" \
              -o dist/invoicer-linux-$arch ./cmd/invoicer
          done

      - name: Sign update manifest
        if: steps.v.outputs.skip != 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          TAG: ${{ steps.v.outputs.tag }}
          MIN: ${{ steps.v.outputs.min }}
          CRIT: ${{ steps.v.outputs.critical }}
          NOTES: ${{ steps.v.outputs.notes }}
        run: |
          ARGS=(-version "$TAG" -dir dist -notes "$NOTES")
          if [ -n "$MIN" ]; then ARGS+=(-min "$MIN"); fi
          if [ "$CRIT" = "true" ]; then ARGS+=(-critical); fi
          go run ./cmd/release manifest "${ARGS[@]}"
          (cd dist && sha256sum invoicer-linux-* > SHA256SUMS)

      - name: Tag and publish GitHub release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: steps.v.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.v.outputs.skip != 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.v.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: img
        if: steps.v.outputs.skip != 'true'
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        if: steps.v.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.tag }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.v.outputs.tag }}
            ${{ steps.img.outputs.name }}:latest
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.v.outputs.skip != 'true'
      - name: Sign the image (keyless, verifiable with cosign verify)
        if: steps.v.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.img.outputs.name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
