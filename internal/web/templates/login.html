{{define "content"}}
<div class="auth">
  <div class="auth-logo">{{template "brandmark" 34}} <span>Invoicer</span></div>
  <div class="card auth-card">
    <h1>{{.T "login.title"}}</h1>
    <form method="post" action="/login" class="stack">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <input type="hidden" name="next" value="{{.Data.Next}}">
      <div class="field">
        <label for="email">{{.T "field.email"}}</label>
        <input id="email" name="email" type="email" required autofocus value="{{.Data.Email}}" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">{{.T "field.password"}}</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-block" type="submit">{{.T "login.submit"}}</button>
    </form>
    <p class="hint center">{{.T "login.forgot"}}</p>
  </div>
</div>
{{end}}
