{{define "content"}}
<div class="auth">
  <div class="auth-logo">{{template "brandmark" 34}} <span>Invoicer</span></div>
  <div class="card auth-card">
    <h1>{{.T "setup.title"}}</h1>
    <p class="muted">{{.T "setup.intro"}}</p>
    <form method="post" action="/setup" class="stack" autocomplete="on">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <input type="hidden" name="tz" value="" data-timezone>
      <div class="field">
        <label for="name">{{.T "field.your_name"}}</label>
        <input id="name" name="name" required maxlength="120" value="{{.Data.Name}}" autocomplete="name" autofocus>
      </div>
      <div class="field">
        <label for="email">{{.T "field.email"}}</label>
        <input id="email" name="email" type="email" required maxlength="200" value="{{.Data.Email}}" autocomplete="email">
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="password">{{.T "field.password"}}</label>
          <input id="password" name="password" type="password" required minlength="12" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="password2">{{.T "field.password_confirm"}}</label>
          <input id="password2" name="password2" type="password" required minlength="12" autocomplete="new-password">
        </div>
      </div>
      <p class="hint">{{.T "field.password_hint"}}</p>
      <div class="field">
        <label for="lang">{{.T "field.ui_language"}}</label>
        <select id="lang" name="lang">{{range langs}}<option value="{{.}}" {{if eq . $.Data.Lang}}selected{{end}}>{{$.TS "lang." .}}</option>{{end}}</select>
      </div>
      <div class="note">{{template "icon" "shield"}}<span>{{.T "setup.owner_note"}}</span></div>
      <button class="btn btn-primary btn-block" type="submit">{{.T "setup.submit"}}</button>
    </form>
    <p class="small center setup-restore-link">{{.T "migrate.setup_link_q"}} <a href="/setup/restore">{{.T "migrate.setup_link"}} →</a></p>
  </div>
</div>
{{end}}
