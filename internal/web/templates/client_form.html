{{define "content"}}
{{$cl := .Data.Client}}
<div class="page-head">
  <div>
    <a class="back" href="{{if $cl.ID}}{{.CPath "/clients/%d" $cl.ID}}{{else}}{{.CPath "/clients"}}{{end}}">← {{.T "action.back"}}</a>
    <h1>{{if $cl.ID}}{{.T "client.edit"}}{{else}}{{.T "client.new"}}{{end}}</h1>
  </div>
</div>
<form method="post" class="card form-card stack">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <div class="grid-2">
    <div class="field"><label for="name">{{.T "field.client_name"}}</label><input id="name" name="name" required maxlength="200" value="{{$cl.Name}}" autofocus></div>
    <div class="field"><label for="contact_name">{{.T "field.contact_name"}}</label><input id="contact_name" name="contact_name" maxlength="200" value="{{$cl.ContactName}}"></div>
  </div>
  <div class="grid-2">
    <div class="field"><label for="email">{{.T "field.email"}}</label><input id="email" name="email" type="email" maxlength="200" value="{{$cl.Email}}"><p class="hint">{{.T "field.client_email_hint"}}</p></div>
    <div class="field"><label for="cc_emails">{{.T "field.cc"}}</label><input id="cc_emails" name="cc_emails" maxlength="600" value="{{$cl.CCEmails}}"><p class="hint">{{.T "field.cc_hint"}}</p></div>
  </div>
  <div class="field"><label for="address">{{.T "field.address"}}</label><textarea id="address" name="address" rows="3" maxlength="1000">{{$cl.Address}}</textarea></div>
  <div class="grid-3">
    <div class="field"><label for="tax_id">{{.T "field.tax_id"}}</label><input id="tax_id" name="tax_id" maxlength="60" value="{{$cl.TaxID}}"></div>
    <div class="field"><label for="lang">{{.T "field.doc_language"}}</label>
      <select id="lang" name="lang">{{range langs}}<option value="{{.}}" {{if eq . $cl.Lang}}selected{{end}}>{{$.TS "lang." .}}</option>{{end}}</select>
      <p class="hint">{{.T "field.doc_language_hint"}}</p></div>
    <div class="field"><label for="currency">{{.T "field.currency"}}</label>
      <select id="currency" name="currency"><option value="">{{.T "field.company_default"}}</option>{{range currencies}}<option {{if eq . $cl.Currency}}selected{{end}}>{{.}}</option>{{end}}</select></div>
  </div>
  <div class="field"><label for="notes">{{.T "field.internal_notes"}}</label><textarea id="notes" name="notes" rows="2" maxlength="2000">{{$cl.Notes}}</textarea></div>
  {{if $cl.ID}}<label class="check"><input type="checkbox" name="archived" value="1" {{if $cl.Archived}}checked{{end}}> {{.T "client.archive"}}</label>{{end}}
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">{{.T "action.save"}}</button>
  </div>
</form>
{{if $cl.ID}}
<form method="post" action="{{.CPath "/clients/%d/delete" $cl.ID}}" class="danger-zone" data-confirm="{{.T "client.delete_confirm"}}">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <button class="btn btn-danger-ghost btn-sm" type="submit">{{template "icon" "trash"}}{{.T "client.delete"}}</button>
</form>
{{end}}
{{end}}
